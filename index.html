<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Threadsにゃんせき</title>
<meta name="description" content="あなたのThreads投稿を、まるっと分析。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%B1%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDF1E2; --card:#FBFDF5;
    --sage:#8FB06A; --sage-deep:#6E9A4E; --sage-soft:#E4EED4;
    --terra:#D68A5A; --terra-deep:#C0703F; --terra-soft:#F5E7D8;
    --brown:#5A5241; --text:#42473A; --muted:#96A085; --line:#DFE6D2;
    --serif:'Shippori Mincho B1',serif;
    --sans:'Zen Kaku Gothic New',-apple-system,'Hiragino Kaku Gothic ProN',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--sans);background:#DBE4CB;color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;padding:20px 10px 50px;letter-spacing:.01em;}
  .phone{max-width:420px;margin:0 auto;background:var(--bg);border-radius:34px;overflow:hidden;box-shadow:0 20px 55px rgba(75,64,56,.20);border:7px solid #fff;}
  .scroll{padding:0 17px 30px;}

  .hero{position:relative;height:170px;background:linear-gradient(135deg,#B7CE96,#8FB06A);}
  .hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .brand{text-align:center;padding:18px 16px 4px;}
  .brand .kicker{font-size:10px;letter-spacing:.32em;color:var(--sage-deep);font-weight:700;}
  .brand h1{font-family:var(--serif);font-weight:700;font-size:25px;color:var(--brown);margin-top:6px;letter-spacing:.06em;}
  .brand p{font-size:11.5px;color:var(--muted);margin-top:4px;}

  .periods{display:flex;gap:7px;padding:14px 0 2px;}
  .periods .pt{flex:1;text-align:center;font-size:11.5px;font-weight:700;padding:9px 0;border-radius:999px;background:transparent;color:var(--muted);border:1px solid var(--line);cursor:pointer;letter-spacing:.03em;}
  .periods .pt.on{background:var(--sage-deep);color:#fff;border-color:var(--sage-deep);}

  .views{display:flex;gap:6px;padding:14px 0 0;}
  .views .vt{flex:1;text-align:center;font-size:12.5px;font-weight:700;padding:11px 0;border-radius:13px;background:var(--card);color:var(--muted);border:1px solid var(--line);cursor:pointer;}
  .views .vt.on{background:var(--brown);color:#fff;border-color:var(--brown);}
  .ranktabs{display:flex;gap:6px;margin:0 0 11px;overflow-x:auto;padding-bottom:3px;-webkit-overflow-scrolling:touch;}
  .ranktabs .rt{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:7px 13px;border-radius:999px;background:var(--card);color:var(--muted);border:1px solid var(--line);cursor:pointer;white-space:nowrap;}
  .ranktabs .rt.on{background:var(--sage-deep);color:#fff;border-color:var(--sage-deep);}
  .listbar{display:flex;gap:8px;margin-top:16px;}
  .listbar .search{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:10px 13px;font-size:13px;font-family:inherit;color:var(--text);background:var(--card);}
  .listbar .sortsel{border:1px solid var(--line);border-radius:12px;padding:10px 8px;font-size:12px;font-family:inherit;color:var(--text);background:var(--card);}
  .listcount{font-size:11px;color:var(--muted);margin:14px 2px 8px;font-weight:700;}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;}
  .pcard .pmeta{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted);}
  .pcard .pmeta .plink{color:var(--sage-deep);text-decoration:none;font-weight:700;}
  .pcard .ptext{font-size:13px;color:var(--text);margin:9px 0 12px;white-space:pre-wrap;word-break:break-word;line-height:1.7;}
  .pmetrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);padding-top:11px;}
  .pmetrics .mt{text-align:center;background:var(--bg);border-radius:10px;padding:7px 2px;}
  .pmetrics .mt span{font-size:13px;}
  .pmetrics .mt b{display:block;font-size:14px;color:var(--brown);font-weight:700;margin-top:2px;font-family:var(--serif);}
  .pmetrics .mt i{font-size:9px;color:var(--muted);font-style:normal;}
  .pmetrics .hlmt{background:var(--terra-soft);}
  .pmetrics .hlmt b{color:var(--terra-deep);}

  .backbar{padding:14px 0 0;}
  .backbtn{background:var(--card);border:1px solid var(--line);color:var(--brown);border-radius:999px;padding:9px 16px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;}
  .detail-title{font-family:var(--serif);font-size:20px;color:var(--brown);margin:18px 2px 4px;letter-spacing:.04em;}
  .detail-sub{font-size:11.5px;color:var(--muted);margin:0 2px 14px;}
  .kpi{cursor:pointer;transition:transform .1s;}
  .kpi:active{transform:scale(.97);}
  .taphint{font-size:11px;color:var(--sage-deep);font-weight:700;margin-top:10px;text-align:right;}
  .clickhint{font-size:10.5px;color:var(--sage-deep);font-weight:700;font-family:var(--sans);}
  .rank-label{font-size:13px;font-weight:700;color:var(--brown);margin:22px 2px 9px;}
  .rank-label.worst{color:var(--terra-deep);}
  .mcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:9px;display:flex;gap:12px;align-items:flex-start;}
  .mcard .big{font-family:var(--serif);font-size:21px;font-weight:700;color:var(--sage-deep);flex-shrink:0;min-width:66px;text-align:center;line-height:1.15;}
  .mcard .big small{display:block;font-size:9px;color:var(--muted);font-weight:400;font-family:var(--sans);margin-top:2px;}
  .mcard.worst .big{color:var(--terra-deep);}
  .mcard .mc-body{flex:1;min-width:0;}
  .mcard .mc-txt{font-size:12px;color:var(--text);line-height:1.65;max-height:3.3em;overflow:hidden;}
  .mcard .mc-sub{font-size:10px;color:var(--muted);margin-top:6px;}
  .insight{background:var(--sage-soft);border-radius:14px;padding:14px;font-size:12.5px;color:var(--sage-deep);line-height:1.9;}
  .insight b{color:var(--brown);}
  .hourblock{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:9px;}
  .hourblock .hh{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--brown);font-size:13px;margin-bottom:6px;}
  .hourblock .hh .cnt{margin-left:auto;font-size:10px;color:var(--muted);font-weight:400;}
  .hourblock .hp{font-size:11.5px;color:var(--text);padding:7px 0;border-top:1px dashed var(--line);line-height:1.55;}
  .hourblock .hp .hpm{color:var(--muted);font-size:10px;}
  .wk-x{display:flex;justify-content:space-between;margin-top:7px;padding:0 2px;}
  .wk-x span{font-size:8.5px;color:var(--muted);flex:1;text-align:center;}
  .wk-y{font-size:10px;color:var(--muted);margin-bottom:8px;}
  .wk-y b{color:var(--brown);}
  .repintro{font-size:12.5px;color:var(--text);line-height:1.85;margin-bottom:14px;}
  .repintro b{color:var(--sage-deep);}
  .repsteps{background:var(--sage-soft);border-radius:14px;padding:13px 16px;font-size:12px;color:var(--sage-deep);line-height:2;margin-bottom:16px;}
  .repsteps b{color:var(--brown);}
  .copybtn{width:100%;background:var(--brown);color:#fff;border:none;border-radius:14px;padding:16px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:.12s;}
  .copybtn:active{transform:scale(.98);}
  .copybtn.done{background:var(--sage-deep);}
  .repnote{font-size:11px;color:var(--muted);margin-top:14px;margin-bottom:6px;}
  .reptext{width:100%;height:150px;border:1px solid var(--line);border-radius:12px;padding:11px;font-size:10.5px;font-family:ui-monospace,monospace;color:var(--muted);background:var(--card);resize:vertical;line-height:1.5;}

  .sec{margin-top:24px;}
  .sec-h{font-family:var(--serif);font-weight:600;font-size:15px;color:var(--brown);margin:0 2px 11px;letter-spacing:.05em;display:flex;align-items:center;gap:8px;}
  .sec-h .ln{flex:1;height:1px;background:var(--line);}
  .sec-h .mini{font-size:10.5px;color:var(--muted);font-weight:400;font-family:var(--sans);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;}

  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px;position:relative;overflow:hidden;}
  .kpi .lab{font-size:10.5px;color:var(--muted);letter-spacing:.06em;font-weight:700;}
  .kpi .val{font-family:var(--serif);font-size:25px;font-weight:700;color:var(--brown);margin-top:3px;line-height:1.2;}
  .kpi .val small{font-size:13px;color:var(--muted);}
  .kpi .sub{font-size:10.5px;font-weight:700;margin-top:4px;}
  .kpi.hl{background:linear-gradient(140deg,#9DBE72,#6E9A4E);border:none;}
  .kpi.hl .lab,.kpi.hl .val,.kpi.hl .val small{color:#fff;}
  .kpi.hl .sub{color:rgba(255,255,255,.92);}
  .kpi .deco{position:absolute;right:-4px;bottom:-6px;font-size:30px;opacity:.16;}

  .chart-title{font-size:11.5px;color:var(--muted);letter-spacing:.05em;margin-bottom:10px;font-weight:700;}
  .bars{display:flex;align-items:flex-end;gap:7px;height:100px;}
  .bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end;}
  .bars .bar{width:100%;border-radius:6px 6px 2px 2px;min-height:2px;}
  .bars .bar.like{background:linear-gradient(var(--sage),var(--sage-deep));}
  .bars .bar.view{background:linear-gradient(#E7BE95,#D68A5A);}
  .bars .bar.best{outline:2px solid var(--terra-deep);outline-offset:1px;}
  .bars .bv{font-size:9px;color:var(--muted);font-weight:700;}
  .bars .bx{font-size:9px;color:var(--muted);}
  .divider{height:1px;background:var(--line);margin:15px 0;}
  .peak{font-size:11px;color:var(--terra-deep);font-weight:700;margin-top:10px;text-align:center;}

  .legend{font-size:10.5px;color:var(--muted);display:flex;gap:14px;align-items:center;justify-content:center;margin-top:8px;}
  .dotm{display:inline-block;width:9px;height:9px;border-radius:3px;vertical-align:middle;margin-right:5px;}
  .line-cap{font-size:10.5px;color:var(--muted);margin-top:6px;text-align:center;}

  .stack{display:flex;height:16px;border-radius:999px;overflow:hidden;margin-bottom:15px;background:var(--line);}
  .stack i{display:block;height:100%;}
  .brk{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line);}
  .brk:last-child{border-bottom:none;}
  .brk .ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
  .brk .nm{font-weight:700;font-size:13px;color:var(--brown);}
  .brk .mean{font-size:10.5px;color:var(--muted);}
  .brk .pc{margin-left:auto;text-align:right;}
  .brk .pc b{font-family:var(--serif);font-size:17px;color:var(--brown);}
  .brk .pc span{display:block;font-size:9.5px;color:var(--muted);}
  .verdict{margin-top:14px;background:var(--sage-soft);border-radius:12px;padding:11px 13px;font-size:12px;color:var(--sage-deep);font-weight:700;}

  .cmp{display:flex;gap:12px;}
  .cmp .col{flex:1;text-align:center;background:var(--sage-soft);border-radius:14px;padding:14px 8px;}
  .cmp .col.win{background:var(--terra-soft);}
  .cmp .col .ic{font-size:22px;}
  .cmp .col .t{font-size:11.5px;color:var(--brown);font-weight:700;margin-top:3px;}
  .cmp .col .n{font-family:var(--serif);font-size:21px;font-weight:700;color:var(--brown);margin-top:5px;}
  .cmp .col .u{font-size:9.5px;color:var(--muted);}
  .cmp .col .tag{display:inline-block;margin-top:7px;font-size:10px;font-weight:700;background:var(--terra);color:#fff;border-radius:999px;padding:2px 10px;}

  .rk{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);}
  .rk:last-child{border-bottom:none;}
  .rk .no{width:23px;height:23px;flex-shrink:0;border-radius:50%;background:var(--sage-soft);color:var(--sage-deep);font-family:var(--serif);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;}
  .rk .no.top{background:var(--terra);color:#fff;}
  .rk .tx{flex:1;min-width:0;}
  .rk .tx .p{font-size:12.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rk .tx .m{font-size:10px;color:var(--muted);margin-top:2px;}
  .rk .mult{font-size:11px;font-weight:700;color:var(--terra-deep);background:var(--terra-soft);border-radius:999px;padding:3px 9px;white-space:nowrap;}
  .rk a{color:inherit;text-decoration:none;display:flex;align-items:center;gap:12px;width:100%;}

  .kw{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .kw .k{border-radius:999px;padding:6px 13px;font-weight:700;color:var(--sage-deep);background:var(--sage-soft);}
  .kw .k.big{font-size:16px;background:var(--sage);color:#fff;}
  .kw .k.mid{font-size:13px;}
  .kw .k.sm{font-size:11.5px;}

  .advice{background:linear-gradient(140deg,#EAF1DB,#DAE7C2);border-radius:18px;padding:16px;display:flex;gap:12px;align-items:flex-start;}
  .advice .ac{font-size:26px;flex-shrink:0;}
  .advice .at{font-size:12.5px;color:#4f5a3c;line-height:1.75;}
  .advice .at b{color:var(--terra-deep);}

  .state{padding:50px 24px;text-align:center;color:var(--muted);}
  .state .em{font-size:40px;}
  .state p{margin-top:12px;font-size:13px;}
  .spinner{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--sage-deep);border-radius:50%;margin:0 auto;animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .errbox{background:#FBEBE2;border:1px solid #E9C3AC;border-radius:14px;padding:14px;font-size:12px;color:#9a5a35;text-align:left;word-break:break-word;}
  .updbtn{margin-top:14px;background:var(--sage-deep);color:#fff;border:none;border-radius:999px;padding:10px 22px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;}

  .foot{text-align:center;font-size:10px;color:var(--muted);margin-top:22px;letter-spacing:.06em;}
</style>
</head>
<body>
  <div class="phone">
    <div class="hero"><img src="cats.png" alt="" onerror="this.style.display='none'"></div>
    <div class="brand">
      <div class="kicker">T H R E A D S　A N A L Y T I C S</div>
      <h1>Threadsにゃんせき</h1>
      <p id="brandsub">読み込み中…</p>
    </div>
    <div class="scroll">
      <div id="app">
        <div class="state">
          <div class="spinner"></div>
          <p>あなたのThreadsを分析しています…🐱<br><small>投稿数によっては少し時間がかかります</small></p>
        </div>
      </div>
    </div>
  </div>

<script>
const $ = (h) => { const d=document.createElement('div'); d.innerHTML=h.trim(); return d.firstChild; };
const nf = (n) => (n==null? '—' : Number(n).toLocaleString('ja-JP'));
const kf = (n) => { n=Number(n)||0; return n>=10000? (n/10000).toFixed(1)+'万' : n>=1000? (n/1000).toFixed(1)+'k' : String(Math.round(n)); };
const eng = (p) => (p.likes||0)+(p.replies||0)+(p.reposts||0)+(p.quotes||0);
const hasMedia = (p) => p.type && !['TEXT_POST','TEXT'].includes(p.type);

let DATA = null;
let PERIOD = 'all';
let VIEW = 'dashboard';
let VIEW_METRIC = 'views';
let RANK_MODE = 'total';
let LIST_SORT = 'new';
let LIST_Q = '';

async function load(){
  try{
    const r = await fetch('/api/insights');
    const d = await r.json();
    if(d.error){ return renderError(d.error); }
    DATA = d;
    // リポスト・返信などの「本文なし＋反応ゼロ」ノイズを除外（平均が下がるのを防ぐ）
    DATA.posts = (DATA.posts||[]).filter(p=>{
      if(p.type === 'REPOST_FACADE') return false;
      const noText = !(p.text && p.text.trim());
      const noData = ((p.views||0)+(p.likes||0)+(p.replies||0)+(p.reposts||0)+(p.quotes||0)) === 0;
      return !(noText && noData);
    });
    DATA.count = DATA.posts.length;
    document.getElementById('brandsub').textContent = (d.username? '@'+d.username+' ・ ' : '') + '全'+DATA.count+'投稿を分析';
    render();
  }catch(e){ renderError(String(e.message||e)); }
}

function renderError(msg){
  document.getElementById('brandsub').textContent = 'エラー';
  document.getElementById('app').innerHTML = '';
  document.getElementById('app').appendChild($(`
    <div class="state">
      <div class="em">😿</div>
      <p>データを取得できませんでした。</p>
      <div class="errbox">${escapeHtml(msg)}</div>
      <button class="updbtn" onclick="location.reload()">もう一度ためす</button>
    </div>`));
}

function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function filtered(){
  const posts = DATA.posts.slice();
  if(PERIOD==='all') return posts;
  const days = PERIOD==='7'? 7 : 30;
  const cut = Date.now() - days*86400*1000;
  return posts.filter(p=> new Date(p.ts).getTime() >= cut);
}

function periodTabsEl(){
  const tabs = $(`<div class="periods">
    <div class="pt" data-p="7">直近1週間</div>
    <div class="pt" data-p="30">直近30日</div>
    <div class="pt" data-p="all">全期間</div>
  </div>`);
  tabs.querySelectorAll('.pt').forEach(t=>{
    if(t.dataset.p===PERIOD) t.classList.add('on');
    t.onclick = ()=>{ PERIOD=t.dataset.p; render(); };
  });
  return tabs;
}
function viewTabsEl(){
  const nav = $(`<div class="views">
    <div class="vt" data-v="dashboard">📊 ダッシュボード</div>
    <div class="vt" data-v="list">📋 投稿一覧</div>
  </div>`);
  nav.querySelectorAll('.vt').forEach(t=>{
    if(t.dataset.v===VIEW) t.classList.add('on');
    t.onclick = ()=>{ VIEW=t.dataset.v; render(); window.scrollTo({top:0,behavior:'smooth'}); };
  });
  return nav;
}

function renderBack(app){
  const b = $(`<div class="backbar"><button class="backbtn">← ダッシュボードに戻る</button></div>`);
  b.querySelector('.backbtn').onclick = ()=>{ VIEW='dashboard'; render(); window.scrollTo({top:0,behavior:'smooth'}); };
  app.appendChild(b);
}
function periodLabel(){ return PERIOD==='7'?'直近1週間':PERIOD==='30'?'直近30日':'全期間'; }

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  if(VIEW==='hours' || VIEW==='metric' || VIEW==='report'){
    renderBack(app);
    app.appendChild(periodTabsEl());
    if(VIEW==='hours') renderHours(app);
    else if(VIEW==='report') renderReport(app);
    else renderMetric(app, VIEW_METRIC);
    return;
  }
  app.appendChild(viewTabsEl());
  app.appendChild(periodTabsEl());
  if(VIEW==='list'){ renderList(app); return; }

  const posts = filtered();
  if(posts.length===0){
    app.appendChild($(`<div class="state"><div class="em">🍃</div><p>この期間の投稿はありません。<br>ほかの期間を選んでみてね。</p></div>`));
    return;
  }

  const n = posts.length;
  const sum = (k)=> posts.reduce((a,p)=>a+(Number(p[k])||0),0);
  const avg = (k)=> sum(k)/n;
  const totalViews = sum('views');
  const totalEng = posts.reduce((a,p)=>a+eng(p),0);
  const egRate = totalViews>0 ? (totalEng/totalViews*100) : 0;
  const WORLD = 2.0; // 世間のおおよその目安(参考)

  // ---- サマリー ----
  const sumSec = $(`<div class="sec">
    <div class="sec-h">サマリー<span class="ln"></span><span class="mini">${DATA.followers!=null? 'フォロワー '+nf(DATA.followers)+' ・ ':''}${n}投稿</span></div>
    <div class="kpis">
      <div class="kpi" data-metric="views"><div class="lab">平均表示回数</div><div class="val">${nf(Math.round(avg('views')))}</div><div class="sub">1投稿あたり</div><div class="deco">👀</div></div>
      <div class="kpi" data-metric="likes"><div class="lab">平均いいね</div><div class="val">${nf(Math.round(avg('likes')))}</div><div class="sub">1投稿あたり</div><div class="deco">❤️</div></div>
      <div class="kpi" data-metric="eng"><div class="lab">平均エンゲージ</div><div class="val">${nf(Math.round(totalEng/n))}</div><div class="sub">反応の合計</div><div class="deco">💬</div></div>
      <div class="kpi hl" data-metric="egr"><div class="lab">EG率（刺さり度）</div><div class="val">${egRate.toFixed(1)}<small>%</small></div><div class="sub">世間の目安 約${WORLD}% ／ ${egRate>=WORLD?'好調です':'のびしろ'}</div><div class="deco">🔥</div></div>
    </div>
    <div class="taphint">タップで詳細（トップ3・ワースト3・共通点）へ →</div>
  </div>`);
  app.appendChild(sumSec);
  sumSec.querySelectorAll('.kpi[data-metric]').forEach(k=>{ k.onclick=()=>{ VIEW='metric'; VIEW_METRIC=k.dataset.metric; render(); window.scrollTo({top:0,behavior:'smooth'}); }; });

  // ---- 時間帯別（4時間×6バケツ） ----
  const buckets = [0,0,0,0,0,0].map(()=>({likes:0,views:0,c:0}));
  const blabels = ['0-3','4-7','8-11','12-15','16-19','20-23'];
  posts.forEach(p=>{ const h=new Date(p.ts).getHours(); const b=Math.floor(h/4); buckets[b].likes+=(p.likes||0); buckets[b].views+=(p.views||0); buckets[b].c++; });
  const bavgL = buckets.map(b=> b.c? b.likes/b.c : 0);
  const bavgV = buckets.map(b=> b.c? b.views/b.c : 0);
  const maxL = Math.max(...bavgL,1), maxV = Math.max(...bavgV,1);
  const bestLi = bavgL.indexOf(Math.max(...bavgL));
  const barsL = bavgL.map((v,i)=>`<div class="b"><div class="bv">${v?kf(v):''}</div><div class="bar like ${i===bestLi&&v>0?'best':''}" style="height:${Math.max(2,v/maxL*100)}%"></div><div class="bx">${blabels[i]}</div></div>`).join('');
  const barsV = bavgV.map((v,i)=>`<div class="b"><div class="bv">${v?kf(v):''}</div><div class="bar view ${i===bestLi&&v>0?'best':''}" style="height:${Math.max(2,v/maxV*100)}%"></div><div class="bx">${blabels[i]}</div></div>`).join('');
  const hoursSec = $(`<div class="sec">

  app.appendChild(hoursSec);

  // ---- 週ごと推移 ----
  const weekMap = {};
  posts.forEach(p=>{ const d=new Date(p.ts); const wk=weekKey(d); (weekMap[wk]=weekMap[wk]||{likes:0,views:0,c:0}); weekMap[wk].likes+=(p.likes||0); weekMap[wk].views+=(p.views||0); weekMap[wk].c++; });
  const weeks = Object.keys(weekMap).sort().slice(-10);
  if(weeks.length>=2){
    const wl = weeks.map(w=> weekMap[w].likes/weekMap[w].c);
    const wv = weeks.map(w=> weekMap[w].views/weekMap[w].c);
    const maxWL = Math.max(...wl), maxWV = Math.max(...wv);
    const wlabels = weeks.map(w=>{ const d=new Date(w); return (d.getMonth()+1)+'月'+Math.ceil(d.getDate()/7)+'週'; });
    const dotsL = wl.map((v,i)=>{ const n=wl.length; const x= n===1?160:(10+i*(300/(n-1))); const y= 118-(v/(maxWL||1))*90; return `<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="3" fill="#6E9A4E"/><text x="${x.toFixed(0)}" y="${(y-6).toFixed(0)}" font-size="8" fill="#6E9A4E" text-anchor="middle">${nf(Math.round(v))}</text>`; }).join('');

        <svg viewBox="0 0 320 130" width="100%" height="130">

          <polyline points="${polyPts(wv)}" fill="none" stroke="#D68A5A" stroke-width="2.5" stroke-linecap="round"/>

        </svg>
        <div class="wk-x">${wlabels.map(l=>`<span>${l}</span>`).join('')}</div>
        <div class="legend"><span><span class="dotm" style="background:#6E9A4E"></span>平均いいね（数字つき）</span><span><span class="dotm" style="background:#D68A5A"></span>平均表示</span></div>
        <div class="line-cap">右肩上がり＝発信の手ごたえUP（直近${weeks.length}週）</div>
      </div>
    </div>`));
  }

  // ---- 反応の内訳 ----
  const rb = {likes:sum('likes'),replies:sum('replies'),reposts:sum('reposts'),quotes:sum('quotes')};
  const rbTotal = rb.likes+rb.replies+rb.reposts+rb.quotes || 1;
  const pct = (v)=> Math.round(v/rbTotal*100);
  let verdict = 'バランスよく反応がついています';
  const rShare=rb.replies/rbTotal, spreadShare=(rb.reposts+rb.quotes)/rbTotal;
  if(rShare>=0.18) verdict='「返信＝会話が生まれる投稿」が得意なタイプ！🗣️';
  else if(spreadShare>=0.22) verdict='「リポスト・引用＝広まる投稿」が得意なタイプ！🔁';
  else verdict='「いいね＝共感される投稿」が得意なタイプ！❤️';
  app.appendChild($(`<div class="sec">
    <div class="sec-h">反応の内訳<span class="ln"></span></div>
    <div class="card">
      <div style="font-size:11px;color:var(--muted);margin-bottom:12px;">どんな反応が多い？＝あなたの投稿の“得意なこと”がわかります</div>
      <div class="stack">
        <i style="width:${pct(rb.likes)}%;background:#6E9A4E"></i><i style="width:${pct(rb.replies)}%;background:#D68A5A"></i>
        <i style="width:${pct(rb.reposts)}%;background:#5A5241"></i><i style="width:${pct(rb.quotes)}%;background:#C6D3AE"></i>
      </div>
      ${brkRow('❤️','var(--sage-soft)','いいね','共感された数',rb.likes,pct(rb.likes))}
      ${brkRow('💬','var(--terra-soft)','返信','会話が生まれた数',rb.replies,pct(rb.replies))}
      ${brkRow('🔁','#EDE6DD','リポスト','広めてもらえた数',rb.reposts,pct(rb.reposts))}
      ${brkRow('✍️','var(--sage-soft)','引用','語りたくなった数',rb.quotes,pct(rb.quotes))}
      <div class="verdict">🐱 あなたは ${verdict}</div>
    </div>
  </div>`));

  // ---- 投稿タイプ別 ----
  const media = posts.filter(hasMedia), text = posts.filter(p=>!hasMedia(p));
  const avgL = (arr)=> arr.length? arr.reduce((a,p)=>a+(p.likes||0),0)/arr.length : 0;
  const mL=avgL(media), tL=avgL(text);
  if(media.length && text.length){
    const mediaWin = mL>=tL;
    const ratio = tL>0 && mL>0 ? (mediaWin? (mL/tL):(tL/mL)).toFixed(1) : null;
    app.appendChild($(`<div class="sec">
      <div class="sec-h">投稿タイプ別の比較<span class="ln"></span><span class="mini">平均いいね</span></div>
      <div class="cmp">
        <div class="col ${!mediaWin?'win':''}"><div class="ic">📝</div><div class="t">文字だけ</div><div class="n">${nf(Math.round(tL))}</div><div class="u">${text.length}投稿</div>${!mediaWin&&ratio?`<div class="tag">${ratio}倍！</div>`:''}</div>
        <div class="col ${mediaWin?'win':''}"><div class="ic">🖼️</div><div class="t">画像・動画あり</div><div class="n">${nf(Math.round(mL))}</div><div class="u">${media.length}投稿</div>${mediaWin&&ratio?`<div class="tag">${ratio}倍！</div>`:''}</div>
      </div>
    </div>`));
  }

  // ---- キーワード ----
  const kw = keywords(posts);
  if(kw.length){
    const max = kw[0].score;
    const chips = kw.map(k=>{ const r=k.score/max; const cls=r>0.66?'big':r>0.33?'mid':'sm'; return `<span class="k ${cls}">${escapeHtml(k.word)}</span>`; }).join('');
    app.appendChild($(`<div class="sec">
      <div class="sec-h">伸びるキーワード・テーマ<span class="ln"></span></div>
      <div class="card"><div class="kw">${chips}</div><div class="line-cap" style="text-align:left;margin-top:11px;">大きい言葉ほど、反応が良いテーマ🐾</div></div>
    </div>`));
  }

  // ---- ランキング（総合＋種類別 切り替え） ----
  const avgEng = totalEng/n;
  const rankSec = $(`<div class="sec">
    <div class="sec-h">投稿ランキング<span class="ln"></span><span class="mini">${periodLabel()}</span></div>
    <div class="ranktabs">
      <div class="rt" data-m="total">🏆 総合</div>
      <div class="rt" data-m="likes">❤️ いいね</div>
      <div class="rt" data-m="views">👀 表示</div>
      <div class="rt" data-m="replies">💬 コメント</div>
      <div class="rt" data-m="egr">🔥 EG率</div>
    </div>
    <div class="card" id="rankcard"></div>
  </div>`);
  app.appendChild(rankSec);
  const rankCard = rankSec.querySelector('#rankcard');
  const rankTabs = rankSec.querySelectorAll('.rt');
  const RANKERS = {
    total:  {g:p=>eng(p),                         big:p=>'平均×'+(avgEng>0?(eng(p)/avgEng).toFixed(1):'—'), sub:p=>`👀${nf(p.views)} ・ ❤️${nf(p.likes)} ・ 💬${nf(p.replies)}`},
    likes:  {g:p=>p.likes||0,                     big:p=>'❤️'+nf(p.likes),  sub:p=>`👀${nf(p.views)} ・ 💬${nf(p.replies)} ・ 🔁${nf(p.reposts)}`},
    views:  {g:p=>p.views||0,                     big:p=>'👀'+nf(p.views),  sub:p=>`❤️${nf(p.likes)} ・ 💬${nf(p.replies)} ・ 🔁${nf(p.reposts)}`},
    replies:{g:p=>p.replies||0,                   big:p=>'💬'+nf(p.replies), sub:p=>`👀${nf(p.views)} ・ ❤️${nf(p.likes)} ・ 🔁${nf(p.reposts)}`},
    egr:    {g:p=>p.views>0?eng(p)/p.views*100:0, big:p=>'🔥'+(p.views>0?(eng(p)/p.views*100).toFixed(1):'0.0')+'%', sub:p=>`👀${nf(p.views)} ・ ❤️${nf(p.likes)} ・ 💬${nf(p.replies)}`},
  };
  function drawRank(){
    rankTabs.forEach(t=> t.classList.toggle('on', t.dataset.m===RANK_MODE));
    const M = RANKERS[RANK_MODE] || RANKERS.total;
    const arr = posts.slice().sort((a,b)=>M.g(b)-M.g(a)).slice(0,5);
    rankCard.innerHTML = arr.map((p,i)=>{
      const txt=(p.text||'(本文なし)').replace(/\n/g,' ');
      return `<div class="rk"><a href="${p.permalink||'#'}" target="_blank" rel="noopener">
        <div class="no ${i<2?'top':''}">${i+1}</div>
        <div class="tx"><div class="p">${escapeHtml(txt)}</div><div class="m">${M.sub(p)}</div></div>
        <div class="mult">${M.big(p)}</div></a></div>`;
    }).join('');
  }
  rankTabs.forEach(t=> t.onclick=()=>{ RANK_MODE=t.dataset.m; drawRank(); });
  drawRank();

  // ---- アドバイス ----
  const adviceSec = $(`<div class="sec">
    <div class="sec-h">今日のひとことアドバイス<span class="ln"></span><span class="clickhint">くわしい戦略レポート ›</span></div>
    <div class="advice"><div class="ac">😺</div><div class="at">${advice(posts,{bestBucket:blabels[bestLi],bestBucketVal:bavgL[bestLi],mL,tL,verdict,egRate,WORLD})}</div></div>
  </div>`);
  adviceSec.style.cursor='pointer';
  adviceSec.onclick = ()=>{ VIEW='report'; render(); window.scrollTo({top:0,behavior:'smooth'}); };

function brkRow(ic,bg,nm,mean,cnt,pc){
  return `<div class="brk"><div class="ic" style="background:${bg}">${ic}</div><div><div class="nm">${nm}</div><div class="mean">${mean}</div></div><div class="pc"><b>${pc}%</b><span>${nf(cnt)}件</span></div></div>`;
}
function weekKey(d){ const t=new Date(d); const day=(t.getDay()+6)%7; t.setDate(t.getDate()-day); return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'); }
function polyPts(arr){ const max=Math.max(...arr,1); const n=arr.length; return arr.map((v,i)=>{ const x= n===1?160:(10+i*(300/(n-1))); const y= 118 - (v/max)*90; return x.toFixed(0)+','+y.toFixed(0); }).join(' '); }

function keywords(posts){
  const stop = new Set(['です','ます','こと','これ','それ','あれ','どれ','ため','よう','そう','とき','もの','ところ','わたし','わたし','みたい','ここ','そこ','ちゃん','さん','たち','とても','本当','今日','昨日','明日','自分','みなさん','みんな']);
  const score = {};
  posts.forEach(p=>{
    const w = eng(p)+1;
    const text = (p.text||'').replace(/https?:\/\/\S+/g,' ');
    const seen = new Set();
    // ハッシュタグ
    (text.match(/[#＃][^\s#＃、。!！?？]+/g)||[]).forEach(h=>{ const k=h.replace(/^[#＃]/,''); if(k.length>=2&&!seen.has(k)){ score[k]=(score[k]||0)+w; seen.add(k);} });
    // 漢字・カタカナのまとまり
    (text.match(/[一-龥々〆ヶ]{2,}|[ァ-ヶー]{3,}/g)||[]).forEach(m=>{ if(m.length>=2 && m.length<=8 && !stop.has(m) && !seen.has(m)){ score[m]=(score[m]||0)+w; seen.add(m);} });
  });
  return Object.entries(score).map(([word,s])=>({word,score:s})).sort((a,b)=>b.score-a.score).slice(0,8);
}

function advice(posts,x){
  const bits=[];
  if(x.mL && x.tL){ if(x.mL>x.tL*1.15) bits.push(`<b>画像・動画つき</b>の投稿が、文字だけより <b>${(x.mL/x.tL).toFixed(1)}倍</b>伸びています`); else if(x.tL>x.mL*1.15) bits.push(`意外にも<b>文字だけ</b>の投稿がよく伸びています`); }
  if(x.bestBucketVal>0) bits.push(`<b>${x.bestBucket}時台</b>の反応がいちばん◎`);
  const clean = x.verdict.replace(/[「」！!🗣️🔁❤️]/g,'').trim();
  bits.push(`あなたの強みは<b>「${clean}」</b>`);
  let msg = bits.slice(0,2).join('。そして') + '。';
  msg += ` 次は「よく伸びるテーマ × ${x.mL>x.tL?'画像':'あなたの得意な形'} × ${x.bestBucketVal>0?x.bestBucket+'時':'反応が良い時間'}」で狙ってみてにゃ🐾`;
  return msg;
}

// ===== くわしい戦略レポート（コピペ方式・月額内でClaudeに分析してもらう） =====
function patternOf(p){
  const t = p.text || '';
  if(/https?:\/\//.test(t) || /(募集|販売|セール|申込|申し込み|リリース|発売|開催|受付|プレゼント|無料配布|告知|クーポン|割引|ＯＦＦ|OFF|キャンペーン|募集中|受付中)/.test(t)) return '告知系';
  if(/[?？]/.test(t)) return '問い形式';
  return '説明形式';
}
function buildReportPrompt(posts){
  const n = posts.length;
  const sum = (k)=> posts.reduce((a,p)=>a+(Number(p[k])||0),0);
  const totalEng = posts.reduce((a,p)=>a+eng(p),0);
  const egRate = sum('views')>0 ? (totalEng/sum('views')*100) : 0;

  const hv = Array.from({length:24},()=>({likes:0,replies:0,c:0}));
  posts.forEach(p=>{ const h=new Date(p.ts).getHours(); hv[h].likes+=(p.likes||0); hv[h].replies+=(p.replies||0); hv[h].c++; });
  let hourLines='';
  for(let h=0;h<24;h++){ if(hv[h].c) hourLines += `- ${h}時台：${hv[h].c}件 / 平均いいね${Math.round(hv[h].likes/hv[h].c)} / 平均コメント${Math.round(hv[h].replies/hv[h].c)}\n`; }

  const pat = {'問い形式':{likes:0,replies:0,c:0},'説明形式':{likes:0,replies:0,c:0},'告知系':{likes:0,replies:0,c:0}};
  posts.forEach(p=>{ const k=patternOf(p); pat[k].likes+=(p.likes||0); pat[k].replies+=(p.replies||0); pat[k].c++; });
  let patLines='';
  Object.entries(pat).forEach(([k,v])=>{ if(v.c) patLines += `- ${k}：${v.c}件 / 平均いいね${Math.round(v.likes/v.c)} / 平均コメント${Math.round(v.replies/v.c)}\n`; });

  let postLines='';
  posts.slice().sort((a,b)=>new Date(b.ts)-new Date(a.ts)).forEach(p=>{
    const d=new Date(p.ts);
    const dt=`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    const t=(p.text||'(本文なし)').replace(/\n/g,' ');
    postLines += `[${dt}｜${patternOf(p)}｜${hasMedia(p)?'画像/動画':'文字'}] 表示${p.views} いいね${p.likes} コメント${p.replies} リポスト${p.reposts} 引用${p.quotes}\n本文：${t}\n\n`;
  });

  return `あなたは、Threadsの発信を伸ばすプロの分析コンサルタントです。
以下の私のThreadsデータをもとに、次のフォーマットで具体的な戦略レポートを書いてください。ふわっとした感想や励ましより、データに基づいた鋭い読み解きと、明日から動ける具体策を優先してください。

【出力フォーマット】
■ 30秒まとめ（1行で今の状態を言い切る）
① データから読める事実（客観的な数字だけ。感想なし。時間帯別と投稿パターン別を中心に）
② なぜそうなるか（読者心理・アルゴリズム構造の視点で。「なぜ問いが強いか」等）
③ 何が良くて何が弱いか（良いこと✅ / 弱いこと⚠️ を箇条書き）
④ 来週の具体プラン（最優先を1つに絞る。理由・内容・期待値も）
✅ 次にやる1つ（すぐ動ける具体アクション＋そのまま使える投稿テンプレ3案）

━━━━━━━━━━
【アカウント】@${DATA.username||'-'} ／ フォロワー：${DATA.followers!=null?DATA.followers:'不明'} ／ 集計期間：${periodLabel()} ／ ${n}投稿
【平均】表示${Math.round(sum('views')/n)} ・ いいね${Math.round(sum('likes')/n)} ・ コメント${Math.round(sum('replies')/n)} ・ エンゲージ率${egRate.toFixed(1)}%

【時間帯別（1時間ごと）】
${hourLines}
【投稿パターン別の反応】
${patLines}
【投稿一覧（新しい順・全${n}件）】
${postLines}━━━━━━━━━━
以上のデータだけを根拠に、上記フォーマットで日本語のレポートを書いてください。`;
}

  if(posts.length===0){ app.appendChild($(`<div class="state"><div class="em">🍃</div><p>この期間の投稿はありません</p></div>`)); return; }

  app.appendChild($(`<div class="repintro">下のボタンでデータをコピーして、<b>Claudeのチャット（claude.ai）の新しいチャット</b>に貼って送信するだけ。あなたのデータをもとに、コンサル級の戦略レポートを書いてくれます🐾（<b>月額の範囲でOK・追加料金なし</b>）</div>`));
  app.appendChild($(`<div class="repsteps"><b>使い方（3ステップ）</b><br>① 下の「分析用データをコピー」を押す<br>② <b>claude.ai</b> を開いて「＋新しいチャット」<br>③ 貼り付けて送信 → レポート完成！✨</div>`));

  const payload = buildReportPrompt(posts);
  const btn = $(`<button class="copybtn">📋 分析用データをコピー</button>`);
  const ta = $(`<textarea class="reptext" readonly></textarea>`);
  ta.value = payload;
  btn.onclick = async ()=>{
    let ok=false;
    try{ await navigator.clipboard.writeText(payload); ok=true; }
    catch(e){ try{ ta.focus(); ta.select(); ok=document.execCommand('copy'); }catch(_){} }
    btn.textContent = ok ? '✅ コピー完了！claude.aiに貼ってね' : '↓ 下の枠を長押しでコピーしてね';
    btn.classList.add('done');
    setTimeout(()=>{ btn.textContent='📋 分析用データをコピー'; btn.classList.remove('done'); }, 3500);
  };
  app.appendChild(btn);
  app.appendChild($(`<div class="repnote">↓ コピーされる内容（確認用。うまくコピーできない時はこの枠から手動で）</div>`));
  app.appendChild(ta);
}

// ===== 指標の深掘りページ（トップ3・ワースト3・共通点） =====
function renderMetric(app, metric){
  const posts = filtered();
  const M = {
    views:{label:'表示回数',emoji:'👀',get:p=>p.views||0,fmt:v=>nf(Math.round(v))},
    likes:{label:'いいね',emoji:'❤️',get:p=>p.likes||0,fmt:v=>nf(Math.round(v))},
    eng:{label:'エンゲージ',emoji:'💬',get:p=>eng(p),fmt:v=>nf(Math.round(v))},
    egr:{label:'EG率',emoji:'🔥',get:p=> p.views>0?eng(p)/p.views*100:0,fmt:v=>v.toFixed(1)+'%'},
  }[metric];
  if(!M){ app.appendChild($(`<div class="state"><p>不明な指標です</p></div>`)); return; }

  app.appendChild($(`<div class="detail-title">${M.emoji} ${M.label}のくわしく</div>`));
  app.appendChild($(`<div class="detail-sub">${periodLabel()} ・ ${posts.length}投稿</div>`));
  if(posts.length===0){ app.appendChild($(`<div class="state"><div class="em">🍃</div><p>この期間の投稿はありません</p></div>`)); return; }

  const sorted = posts.slice().sort((a,b)=>M.get(b)-M.get(a));
  app.appendChild(buildInsight(sorted.slice(0,Math.min(5,sorted.length)), M));

  app.appendChild($(`<div class="rank-label">🏆 トップ3（${M.label}が多い）</div>`));
  sorted.slice(0,3).forEach((p)=> app.appendChild(mcard(p,M,false)));
  app.appendChild($(`<div class="rank-label worst">🔻 ワースト3（${M.label}が少ない）</div>`));
  sorted.slice().reverse().slice(0,3).forEach((p)=> app.appendChild(mcard(p,M,true)));
}

function mcard(p,M,isWorst){
  const d=new Date(p.ts);
  const date=`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}時`;
  const typ=hasMedia(p)?'🖼️':'📝';
  const other=`👀${nf(p.views)}・❤️${nf(p.likes)}・💬${nf(p.replies)}・🔁${nf(p.reposts)}`;
  return $(`<div class="mcard ${isWorst?'worst':''}">
    <div class="big">${M.fmt(M.get(p))}<small>${M.label}</small></div>
    <div class="mc-body">
      <div class="mc-txt">${escapeHtml(p.text||'(本文なし)')}</div>
      <div class="mc-sub">${typ} ${date} ・ ${other}${p.permalink?` ・ <a href="${p.permalink}" target="_blank" rel="noopener" style="color:var(--sage-deep);font-weight:700;">開く↗</a>`:''}</div>
    </div>
  </div>`);
}

function buildInsight(arr, M){
  const n=arr.length||1;
  const mediaPct=Math.round(arr.filter(hasMedia).length/n*100);
  const blabels=['0-3','4-7','8-11','12-15','16-19','20-23'];
  const bc=[0,0,0,0,0,0]; arr.forEach(p=>bc[Math.floor(new Date(p.ts).getHours()/4)]++);
  const bestB=bc.indexOf(Math.max(...bc));
  const kw=keywords(arr).slice(0,4).map(k=>k.word);
  let s=`${M.label}が高い投稿の<b>共通点</b>だよ🐾<br>`;
  s+=`・形式：<b>${mediaPct>=60?'画像・動画つきが多い（'+mediaPct+'%）':mediaPct<=40?'文字だけが多い':'画像と文字が半々'}</b><br>`;
  if(Math.max(...bc)>0) s+=`・時間帯：<b>${blabels[bestB]}時</b>が多め<br>`;
  if(kw.length) s+=`・よく出る言葉：<b>${kw.join(' / ')}</b>`;
  return $(`<div class="insight">${s}</div>`);
}

// ===== 時間帯別の深掘りページ（1時間ごと＋各時間の投稿） =====
function renderHours(app){
  const posts = filtered();
  app.appendChild($(`<div class="detail-title">⏰ 時間帯別のくわしく</div>`));
  app.appendChild($(`<div class="detail-sub">1時間ごと ・ ${periodLabel()} ・ ${posts.length}投稿</div>`));
  if(posts.length===0){ app.appendChild($(`<div class="state"><div class="em">🍃</div><p>この期間の投稿はありません</p></div>`)); return; }

  const hv=Array.from({length:24},()=>({likes:0,views:0,c:0,posts:[]}));
  posts.forEach(p=>{ const h=new Date(p.ts).getHours(); hv[h].likes+=(p.likes||0); hv[h].views+=(p.views||0); hv[h].c++; hv[h].posts.push(p); });
  const avgL=hv.map(x=>x.c?x.likes/x.c:0);
  const maxL=Math.max(...avgL,1);
  const bestH=avgL.indexOf(Math.max(...avgL));
  const bw=320/24;
  const bars=avgL.map((v,h)=>{ const bh=Math.max(1,v/maxL*90); const x=h*bw; return `<rect x="${(x+1).toFixed(1)}" y="${(100-bh).toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${bh.toFixed(1)}" rx="1.5" fill="${h===bestH?'#C0703F':'#8FB06A'}"/>`; }).join('');
  app.appendChild($(`<div class="card">
    <div class="chart-title">🟩 1時間ごとの平均いいね</div>
    <svg viewBox="0 0 320 112" width="100%" height="112">${bars}
      <text x="2" y="110" font-size="8" fill="#96A085">0時</text><text x="78" y="110" font-size="8" fill="#96A085">6時</text>
      <text x="154" y="110" font-size="8" fill="#96A085">12時</text><text x="230" y="110" font-size="8" fill="#96A085">18時</text><text x="298" y="110" font-size="8" fill="#96A085">23時</text>
    </svg>
    <div class="peak">🐾 一番伸びる時間：<b>${bestH}時台</b>（平均❤️${nf(Math.round(avgL[bestH]))}）</div>
  </div>`));

  app.appendChild($(`<div class="rank-label">🕐 各時間に投稿しているもの</div>`));
  for(let h=0;h<24;h++){
    if(hv[h].c===0) continue;
    const avL=Math.round(hv[h].likes/hv[h].c), avV=Math.round(hv[h].views/hv[h].c);
    const plist=hv[h].posts.slice().sort((a,b)=>new Date(b.ts)-new Date(a.ts)).map(p=>{
      const d=new Date(p.ts); const md=`${d.getMonth()+1}/${d.getDate()}`;
      const typ=hasMedia(p)?'🖼️':'📝';
      const snip=escapeHtml((p.text||'(本文なし)').replace(/\n/g,' ').slice(0,44));
      return `<div class="hp">${typ} ${snip}<br><span class="hpm">${md} ・ 👀${nf(p.views)} ・ ❤️${nf(p.likes)} ・ 💬${nf(p.replies)}</span></div>`;
    }).join('');
    app.appendChild($(`<div class="hourblock">
      <div class="hh"><span>${h}時台</span><span class="cnt">${hv[h].c}投稿 ・ 平均❤️${nf(avL)} / 👀${nf(avV)}</span></div>
      ${plist}
    </div>`));
  }
}

// ===== 投稿一覧ページ =====
function renderList(app){
  const bar = $(`<div class="listbar">
    <input class="search" type="text" placeholder="🔍 本文を検索…">
    <select class="sortsel">
      <option value="new">新しい順</option>
      <option value="views">表示が多い順</option>
      <option value="likes">いいねが多い順</option>
      <option value="eng">エンゲージが多い順</option>
      <option value="egr">EG率が高い順</option>
    </select>
  </div>`);
  app.appendChild(bar);
  const listWrap = $(`<div id="listwrap"></div>`);
  app.appendChild(listWrap);

  const search = bar.querySelector('.search');
  const sel = bar.querySelector('.sortsel');
  sel.value = LIST_SORT;
  search.value = LIST_Q;

  const egr = (p)=> (p.views>0 ? eng(p)/p.views*100 : 0);

  function draw(){
    let arr = filtered();
    const q = LIST_Q.trim();
    if(q) arr = arr.filter(p=> (p.text||'').includes(q));
    const sorters = {
      new:  (a,b)=> new Date(b.ts)-new Date(a.ts),
      views:(a,b)=> (b.views||0)-(a.views||0),
      likes:(a,b)=> (b.likes||0)-(a.likes||0),
      eng:  (a,b)=> eng(b)-eng(a),
      egr:  (a,b)=> egr(b)-egr(a),
    };
    arr = arr.slice().sort(sorters[LIST_SORT]||sorters.new);

    if(arr.length===0){ listWrap.innerHTML = '<div class="state"><div class="em">🍃</div><p>該当する投稿がありません</p></div>'; return; }

    listWrap.innerHTML = `<div class="listcount">${arr.length}件を表示</div>` + arr.map(p=>{
      const d = new Date(p.ts);
      const date = `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      const typ = hasMedia(p) ? '🖼️ 画像/動画' : '📝 文字';
      return `<div class="pcard">
        <div class="pmeta"><span>${typ} ・ ${date}</span>${p.permalink?`<a class="plink" href="${p.permalink}" target="_blank" rel="noopener">開く ↗</a>`:''}</div>
        <div class="ptext">${escapeHtml(p.text||'(本文なし)')}</div>
        <div class="pmetrics">
          <div class="mt"><span>👀</span><b>${nf(p.views)}</b><i>表示</i></div>
          <div class="mt"><span>❤️</span><b>${nf(p.likes)}</b><i>いいね</i></div>
          <div class="mt"><span>💬</span><b>${nf(p.replies)}</b><i>返信</i></div>
          <div class="mt"><span>🔁</span><b>${nf(p.reposts)}</b><i>リポスト</i></div>
          <div class="mt"><span>✍️</span><b>${nf(p.quotes)}</b><i>引用</i></div>
          <div class="mt hlmt"><span>🔥</span><b>${egr(p).toFixed(1)}%</b><i>EG率</i></div>
        </div>
      </div>`;
    }).join('');
  }

  search.oninput = ()=>{ LIST_Q = search.value; draw(); };
  sel.onchange = ()=>{ LIST_SORT = sel.value; draw(); };
  draw();
}

load();
</script>
